name: server deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PORT: ${{ secrets.PORT }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
        run: |
          set -e
          for variable in APP_NAME HOST USERNAME PASSWORD PORT AT_API_KEY; do
            if [ -z "${!variable}" ]; then
              echo "::error::GitHub Actions secret $variable is not configured"
              exit 1
            fi
          done

      - name: Copy files via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "."
          target: "/root/nodeapplications/${{ secrets.APP_NAME }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          envs: APP_NAME,AT_USERNAME,AT_API_KEY,AT_SHORTCODE,SYSTEM_NUM,APP_PORT
          script: |
            set -e

            APP_DIR="/root/nodeapplications/$APP_NAME"

            echo "Deploying $APP_NAME to $APP_DIR"

            if ! command -v node >/dev/null 2>&1 || [ "$(node -p "process.versions.node.split('.')[0]")" -lt 20 ]; then
              echo "Node.js 20+ required. Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            else
              echo "Node.js version is compatible: $(node --version)"
            fi

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm not found. Installing npm..."
              sudo apt-get install -y npm
            else
              echo "npm is already installed: $(npm --version)"
            fi

            cd "$APP_DIR"
            if [ ! -f package.json ]; then
              echo "No package.json found in $APP_DIR"
              exit 1
            fi

            umask 077
            {
              printf 'AT_USERNAME=%s\n' "${AT_USERNAME:-sandbox}"
              printf 'AT_API_KEY=%s\n' "$AT_API_KEY"
              printf 'AT_SHORTCODE=%s\n' "${AT_SHORTCODE:-66578}"
              printf 'SYSTEM_NUM=%s\n' "$SYSTEM_NUM"
              printf 'PORT=%s\n' "${APP_PORT:-4000}"
            } > .env

            npm ci --omit=dev

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 not found. Installing PM2 globally..."
              sudo npm install --global pm2
            else
              echo "PM2 is already installed: $(pm2 --version)"
            fi

            if [ ! -f src/receive.js ]; then
              echo "Main file src/receive.js was not found"
              exit 1
            fi

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              echo "Restarting $APP_NAME in PM2..."
              pm2 restart "$APP_NAME" --update-env
            else
              echo "Starting $APP_NAME in PM2..."
              pm2 start src/receive.js \
                --name "$APP_NAME" \
                --node-args="--env-file=.env"
            fi

            pm2 save
            pm2 startup systemd -u "$USER" --hp "$HOME" || true

            echo "Deployment complete for $APP_NAME"
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          AT_USERNAME: ${{ secrets.AT_USERNAME }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          AT_SHORTCODE: ${{ secrets.AT_SHORTCODE }}
          SYSTEM_NUM: ${{ secrets.SYSTEM_NUM }}
          APP_PORT: ${{ secrets.APP_PORT }}
